# Baseline classification (CN vs MCI): models, grids and fixed parameters.
# To disable a model, delete or comment out its entry (and, to remove it for good, its file in models/).
# Grid order is the tie-break order: the first key is the outermost loop of the Cartesian product and the
# first configuration listed wins on equal inner AUC.
# The smoke grid is the first and last value of every grid list.
feature_sets: [task1, task3, task4, task5, task7, task9, fusion]
models:
  - name: lr_l2
    fixed: {l1_ratio: 0.0, solver: lbfgs, max_iter: 5000}
    grid:
      C: [0.001, 0.01, 0.1, 1, 10, 100]
      class_weight: [null, balanced]
  - name: linear_svm
    fixed: {loss: squared_hinge, dual: auto, max_iter: 20000}
    grid:
      C: [0.0001, 0.001, 0.01, 0.1, 1, 10]
      class_weight: [null, balanced]
  - name: rf
    fixed: {n_estimators: 500, criterion: gini, bootstrap: true, n_jobs: 1}
    smoke_fixed: {n_estimators: 100}
    grid:
      min_samples_leaf: [5, 3, 1]
      max_features: [sqrt, 0.33]
      class_weight: [null, balanced_subsample]
  - name: fnn
    fixed: {activation: relu, solver: adam, learning_rate_init: 0.001, max_iter: 1000, batch_size: auto, early_stopping: false}
    grid:
      alpha: [10, 1, 0.1, 0.001]
      hidden_layer_sizes: [[32], [64, 32]]
      class_weight: [null, balanced]    # balanced = sample weight n / (2 n_c)
  - name: tabpfn                        # frozen TabPFN v3.5, no tuning (inner CV only gives Val AUC and the threshold)
    fixed: {n_estimators: 2}
    grid: {}
  - name: tabpfn_meanprob               # mean of the six per-task TabPFN probabilities; needs the tabpfn cells of tasks 1,3,4,5,7,9
    source_model: tabpfn
    tasks: [1, 3, 4, 5, 7, 9]
  - name: mmse_cutoff                   # fixed clinical rule, no training: MCI if MMSE <= cutoff
    cutoff: 28
    missing: drop                       # error | drop (drop = leave visits without an MMSE out of this model's cell)
